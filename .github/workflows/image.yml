name: Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  # push 事件下 build-push-action 要往 ghcr.io 写，用的就是这个 GITHUB_TOKEN。
  # pull_request 事件（含 fork）拿不到写权限，所以下面的 login 与 push 都对 PR 关掉。
  packages: write

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # Dockerfile 的 builder 阶段钉在 $BUILDPLATFORM 上交叉编译，所以 QEMU 只用于
      # distroless 运行层的组装，不会跑 Go 编译器。留着它是因为 buildx 在导出非本机
      # 架构的镜像层时仍需要 binfmt 处理器。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # semver 类型会做归一化、剥掉前导 v：git tag v0.1.0 只产出 0.1.0 与 0.1。
          # 所以另加 type=ref,event=tag 原样输出 ref 名，把 v0.1.0 本身也发出来——
          # deploy/argocd/application-operator.yaml 钉的就是带 v 的那个。
          # 注意这几行注释必须留在 tags 块外：块标量 | 里的 # 不是 YAML 注释，
          # 会被当成 tag 规则原样喂给 metadata-action。
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # PR 只构建、不推送：fork 上来的 PR 没有 packages: write。
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # 写缓存也对 PR 关掉：Actions 的 cache 服务对 fork 发来的 PR 只读，
          # cache export 会 403，而 BuildKit 的导出是 solve 的一部分，会连带让整个
          # build step 失败。读缓存保留，PR 仍能命中 main 上写好的层。
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
