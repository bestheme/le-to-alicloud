version: "2"
run:
  allow-parallel-runners: true
  build-tags:
    - integration
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    nolintlint:
      # 每条 //nolint 都要点名 linter 并在同一行写明理由；不再需要的抑制要被报出来删掉，
      # 否则抑制会随代码变动悄悄扩大成永久豁免。gosec 不做全局 exclude：它标出来的每一处
      # 都要么真修，要么逐行点名说明为什么是误报。
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - lll
        path: internal/*
      # 测试与测试辅助包里的重复字面量是被测数据，不是待抽取的常量
      - linters:
          - goconst
        path: (_test\.go|/testutil/)
      # 脚手架生成的 SchemeBuilder：controller-runtime 已弃用，但这一行由 operator-sdk 生成
      - linters:
          - staticcheck
        path: api/v1alpha1/groupversion_info.go
        text: "SA1019"
      # 迁移到 events.EventRecorder 会改动全部 16 个事件调用点（证书侧 12 处 + 绑定侧 4 处）
      # 并要求为每条补一个 action 参数，属于行为变更，不在 lint 清理的范围内；见 README「已知限制」
      - linters:
          - staticcheck
        text: "SA1019.*GetEventRecorderFor"
      # 集成探针的 Record(t, id, question, result, detail) 天然是长参数列表，
      # 折行只会让「哪一项在记什么」更难读；Task 3 建的 test/integration/ 整目录豁免 lll
      - linters:
          - lll
        path: test/integration/
      # 探针类用例天然长得几乎一样（换个私钥编码、换个链形状），dupl 会把它们全报出来，
      # 而合并成表驱动反而让「哪一项失败了」在输出里看不清
      - linters:
          - dupl
        path: test/integration/
      # e2e 套件靠 exec.Command 驱动 make / kubectl / kind，9 处 G204 全部是同一回事：
      # 参数来自本包的常量与 fmt.Sprintf 拼出的固定模板，没有一处取自用户输入或网络。
      # 只收窄到 test/e2e/ 且只放 G204——同目录的其它 gosec 规则照常报。
      - linters:
          - gosec
        path: test/e2e/
        text: "G204"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

# 不截断输出：默认 max-same-issues=3 会把同文案的告警只列前 3 处，
# 摸底时会得到偏小的数字（2026-09-06 gosec 基线 23 条被报成 12 条）。门禁判定不受影响。
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
