version: "2"
run:
  allow-parallel-runners: true
  build-tags:
    - integration
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - lll
        path: internal/*
      # 测试与测试辅助包里的重复字面量是被测数据，不是待抽取的常量
      - linters:
          - goconst
        path: (_test\.go|/testutil/)
      # 脚手架生成的 SchemeBuilder：controller-runtime 已弃用，但这一行由 operator-sdk 生成
      - linters:
          - staticcheck
        path: api/v1alpha1/groupversion_info.go
        text: "SA1019"
      # 迁移到 events.EventRecorder 会改动全部 16 个事件调用点（证书侧 12 处 + 绑定侧 4 处）
      # 并要求为每条补一个 action 参数，属于行为变更，不在 lint 清理的范围内；见 README「已知限制」
      - linters:
          - staticcheck
        text: "SA1019.*GetEventRecorderFor"
      # 集成探针的 Record(t, id, question, result, detail) 天然是长参数列表，
      # 折行只会让「哪一项在记什么」更难读；Task 3 建的 test/integration/ 整目录豁免 lll
      - linters:
          - lll
        path: test/integration/
      # 探针类用例天然长得几乎一样（换个私钥编码、换个链形状），dupl 会把它们全报出来，
      # 而合并成表驱动反而让「哪一项失败了」在输出里看不清
      - linters:
          - dupl
        path: test/integration/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
