# operator 的告警规则。四条覆盖四种彼此独立的失败模式，删掉任何一条都会留下盲区。
#
# aliyuncert_binding_applied_age_seconds 由绑定 controller 注册；
# 该指标尚未出现时，AliyunCertificateBindingStale 对空 series 求值为空，不会误报。
#
# 关于 status.lastAppliedTime 为 nil：绑定 controller 有一条「采纳既有正确域名」的短路
# 路径，它写下 appliedFingerprint 但把 lastAppliedTime 留成 nil（见 freezeApplied 的
# wrote 分支）。这些规则一概**不读 lastAppliedTime**——applied_age 的取值来自
# appliedFingerprint 与证书 status.current.fingerprint 的比对（appliedLag），指纹相等即
# 为 0。所以短路采纳在这里被正确地读成「已采纳」，而不是「从未应用」，不会误报。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: le-to-alicloud
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-alerts
  namespace: system
spec:
  groups:
    - name: le-to-alicloud
      rules:
        # 到期。最直接的一条，但它单独不够：证书续期成功而线上没跟上，它是沉默的。
        - alert: AliyunCertificateExpiringSoon
          expr: aliyuncert_certificate_not_after_timestamp_seconds - time() < 7 * 86400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "AliyunCertificate {{ $labels.namespace }}/{{ $labels.name }} 将在 7 天内过期"
        # 新鲜度。独有的失败模式：证书续期成功，但没被推到线上。必须与上一条并存。
        #
        # 这里**刻意没有** `and on (namespace, name) aliyuncert_certificate_ready == 1`
        # 这个守卫（spec §10.3 的原式子有，Ruling P3-R42 裁定去掉）。原因是两个指标的
        # namespace/name 指的不是同一个对象：applied_age 的是 Binding 的
        # （metrics.go:163 取 rd.b.Namespace/Name），certificate_ready 的是
        # AliyunCertificate 的（metrics.go:187 取 ac.Namespace/Name）。仓库自带样例就是
        # Certificate `timehorse-api` 配 Binding `timehorse-api-fc3`——`on` 匹配不上，
        # 整条表达式恒为空，这条 spec §10.1 点名必配的告警会静默失效。
        #
        # 去掉守卫是安全的，它本来就是冗余而非承重：appliedLag
        # （binding_status.go:139-141）在证书 status.current 为 nil 或 fingerprint 为空时
        # 直接返回 0，未签发的证书产生不了非零 lag。
        #
        # 更完备的做法是给 bindingAppliedAge 加一个 certificate label，再用
        # `group_left` 关联回 certificate_ready；那要改 internal/controller/metrics.go，
        # 超出本任务范围。**别看到「少了个守卫」就把 on (namespace, name) 加回来**——
        # 那会让这条告警重新变成恒空。
        - alert: AliyunCertificateBindingStale
          expr: aliyuncert_binding_applied_age_seconds > 86400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Binding {{ $labels.namespace }}/{{ $labels.name }} 上生效的证书已超过 24 小时未更新"
        # 应恒为 0：重建 cert-manager Certificate 会消耗 Let's Encrypt 配额。
        - alert: AliyunCertificateManagerCertRecreated
          expr: increase(aliyuncert_certmanager_certificate_recreated_total[1d]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.name }} 的 cert-manager Certificate 被重建，会消耗 ACME 配额"
        # Abandon 策略会在 CAS 留下孤儿证书，需要人工清理，且会吃掉账号配额。
        - alert: AliyunCertificateCleanupAbandoned
          expr: increase(aliyuncert_cleanup_abandoned_total[1d]) > 0
          labels:
            severity: warning
          annotations:
            summary: "region {{ $labels.region }} 放弃了 CAS 清理，存在需人工删除的孤儿证书"
