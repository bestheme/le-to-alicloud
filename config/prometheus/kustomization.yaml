# 本目录 YAML 里的 `namespace: system` 是 kubebuilder 脚手架的占位，不是真实 namespace。
# 引用本目录的入口（目前只有 `config/overlays/openshift`；`config/default` 里的 `- ../prometheus` 是注释掉的）
# 会用 kustomize 的 namespace 变换器把它改写成 `le-to-alicloud-system`。
# 因此本目录**不能单独 apply**（那样对象会真的落进字面量 `system`），只能作为上面两个入口的组成部分渲染。

resources:
- monitor.yaml
- prometheusrule.yaml

# [PROMETHEUS-WITH-CERTS] The following patch configures the ServiceMonitor in ../prometheus
# to securely reference certificates created and managed by cert-manager.
# Additionally, ensure that you uncomment the [METRICS-WITH-CERTS] patch under config/operator/kustomization.yaml
# to mount the "metrics-server-cert" secret in the Manager Deployment.
