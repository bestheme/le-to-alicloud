---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificates/finalizers
  verbs:
  - update
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificates/status
  verbs:
  - get
  - patch
  - update
