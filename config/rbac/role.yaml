---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - delete
  - get
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificatebindings
  - aliyuncertificates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificatebindings/finalizers
  - aliyuncertificates/finalizers
  verbs:
  - update
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificatebindings/status
  - aliyuncertificates/status
  verbs:
  - get
  - patch
  - update
