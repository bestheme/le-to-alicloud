# This rule is not used by the project le-to-alicloud itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over certs.bestheme.ac.cn.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: le-to-alicloud
    app.kubernetes.io/managed-by: kustomize
  name: aliyuncertificate-admin-role
rules:
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificates
  verbs:
  - '*'
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificates/status
  verbs:
  - get
