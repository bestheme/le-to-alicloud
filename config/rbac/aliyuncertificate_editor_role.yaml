# This rule is not used by the project le-to-alicloud itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the certs.bestheme.ac.cn.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: le-to-alicloud
    app.kubernetes.io/managed-by: kustomize
  name: aliyuncertificate-editor-role
rules:
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - certs.bestheme.ac.cn
  resources:
  - aliyuncertificates/status
  verbs:
  - get
