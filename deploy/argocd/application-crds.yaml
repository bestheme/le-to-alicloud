# CRD 单独一个 Application。理由有三：
#   1. CRD 与 CR 的生命周期不同——prune 掉 CRD 会连带删掉所有 CR 与云上的证书；
#   2. wave -2 让它整体先于 operator 落地——**但这只在本 Application 由 app-of-apps
#      父应用（deploy/argocd/root-application.yaml）下发时成立**。wave 排序的是单次
#      sync 操作内部的资源；只要子 Application 是被 oc 直接创建的（无论是逐个 apply，
#      还是 `oc apply -f deploy/argocd/` 把整个目录一起 apply），它们就各自独立
#      automated sync、并发执行，-2 是死字符串，operator 完全可能先于 CRD 起来。
#      不走 root 时必须人工保证顺序：先 apply 本文件，等两个 CRD 变成 Established，
#      再 apply application-operator.yaml 与凭证那份。
#   3. 与 operator Application 的资源集合不相交，Argo 不会报 shared resource。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: le-to-alicloud-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    # 刻意不加 resources-finalizer：删掉这个 Application 不应该连锁删除 CRD。
    #
    # **注意这只挡得住 `oc delete application le-to-alicloud-crds`。**
    # `argocd app delete` 的 --cascade 默认为 true，CLI 会在删除前主动把
    # resources-finalizer.argocd.argoproj.io **patch 进对象**；Argo UI 的删除对话框
    # 同样默认级联。git 里写什么都拦不住这条路。走到那一步：CRD 被删 → apiserver
    # 级联删光所有 AliyunCertificate / AliyunCertificateBinding → 它们带 finalizer，
    # 而 operator 属于另一个 Application、此刻还活着 → operator 会真的去删阿里云 CAS
    # 上的证书并解绑 FC3 自定义域名。
    # 所以用 CLI / UI 删这个 Application 时必须显式 `argocd app delete <app> --cascade=false`。
    # 第二道防线由 CRD 资源自身承载，不在本文件里：两个 CRD 上的
    # argocd.argoproj.io/sync-options: Delete=false 注解（由 config/crd 提供）会让
    # Argo 即便走级联也不删它们。部署前请确认该注解在位：
    #   ./bin/kustomize build config/crd | grep -A1 sync-options
    []
spec:
  project: default
  source:
    repoURL: https://git.dev.bestheme.ac.cn/infra/le-to-alicloud.git
    targetRevision: main
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
    # CRD 是集群级资源，这里的 namespace 只是命名空间级资源的默认落点；
    # config/crd 里没有命名空间级资源，所以它实际只被 CreateNamespace 用到。
    namespace: le-to-alicloud-system
  syncPolicy:
    automated:
      selfHeal: true
      # 刻意不开 prune：CRD 被 prune 会级联删除所有 AliyunCertificate，
      # finalizer 随即去删云上的证书。要删 CRD 请人工执行。
      prune: false
    syncOptions:
      # SSA 让 Argo 与 apiserver 共享字段所有权，避免 last-applied-configuration 与
      # CRD 默认值互相打架；CRD 将来增长也不会撞上 262144 字节的注解上限。
      - ServerSideApply=true
      - CreateNamespace=true
  ignoreDifferences:
    # CRD 的 status 由 apiserver 维护（acceptedNames / conditions / storedVersions），
    # 不忽略的话 Argo 会永远看到 drift 并无限 sync。
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
